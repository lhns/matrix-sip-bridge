# The bridge as a SIP endpoint. It is a user agent the SIP server dials, not a
# remote control for one PBX: call policy stays in the server's own routing.
sip:
    # Address the bridge listens on.
    listen: 0.0.0.0:5060
    # tcp or udp. Keep tcp: a SIP packet is capped at 20480 bytes and a
    # multi-part text message that overflows a UDP datagram is dropped with no
    # error anywhere.
    transport: tcp
    # host:port other SIP elements reach the bridge on, used in Contact and
    # Via. Defaults to listen, which is wrong behind NAT or in Kubernetes.
    public_address: matrix-sip-bridge.example.com:5060

    # The bridge's own SIP identity, "sip:<username>@<domain>".
    username: matrix-sip-bridge
    domain: example.com

    # Address and port written into SDP. No socket is ever opened on them: the
    # bridge has no media stack and its leg is a control leg the dialplan hangs
    # up within a few hundred milliseconds. The SDP still has to be a real
    # answer, because a 200 OK with no SDP makes Asterisk tear the call down
    # and c=0.0.0.0 or a=inactive is read as hold.
    # media_address defaults to the host part of public_address.
    media_address: ""
    media_port: 40000

    # Header the dialplan puts the conference name in:
    #   same => n,SIPAddHeader(X-Conference: sip-${EXTEN})
    conference_header: X-Conference

    # Registration. A SIP server that has the bridge as a static peer needs
    # none, which is the simpler deployment.
    register:
        enabled: false
        server: pbx.example.com:5060
        password: ""
        expiry: 5m

# Text messaging, as SIP MESSAGE in both directions. text/plain only.
messages:
    enabled: true
    # URI template for outbound messages. {number} is replaced with the
    # destination in E.164 including the leading plus.
    outbound_to: sip:{number}@pbx.example.com
    # From URI presented on outbound messages.
    outbound_from: sip:+15551234567@example.com
    # Advertised to Matrix clients as the room's text limit.
    max_length: 1600

# Call bridging: real media, via a conference on the SIP server and
# livekit-sip. The bridge itself never carries audio.
calls:
    enabled: true
    # Prepended to the number (E.164 without the plus) to name the conference
    # holding a call: "sip-15551234567". It is also how the bridge recognises a
    # conference as its own, so an INVITE naming anything else is declined.
    conference_prefix: sip-
    # URI an outbound control leg is sent to when a Matrix user starts a call.
    # {number} is replaced with the destination in E.164 including the plus.
    # The dialplan is expected to read the conference header, dial the number
    # into that conference, and hang the control leg up.
    outbound_uri: sip:matrix-outbound@pbx.example.com
    # Lifetime written into the caller ghost's RTC membership. The bridge
    # publishes it when a call starts and retracts it when the call ends, and
    # never refreshes it, so this is not a liveness signal. It only bounds how
    # long a membership left behind by a crashed bridge shows as a phantom
    # participant before clients discard it. Generous on purpose: it must
    # outlast any call, and the startup sweep handles the crash case.
    membership_expiry: 6h
    # How long an inbound call waits for a Matrix user to join the RTC session
    # before the bridge declines its leg with 480.
    ring_timeout: 45s
    # How often LiveKit is asked whether the SIP participant is still in the
    # room. That is the only signal the bridge has that a call ended, so this
    # is also the worst-case delay before a finished call is cleaned up.
    participant_poll_interval: 10s

    livekit:
        url: https://livekit.example.com
        api_key: ""
        api_secret: ""
        timeout: 30s

        # livekit-sip needs an outbound trunk object to dial through. It lives
        # in Redis and is lost on a Redis restart, so the bridge recreates it
        # at startup and on this interval.
        trunk_name: matrix-sip-bridge
        # SIP host livekit-sip dials to reach the conference.
        trunk_address: pbx.example.com
        # Caller number livekit-sip presents.
        trunk_number: "+15551234567"
        trunk_auth_username: ""
        trunk_auth_password: ""
        trunk_reconcile_interval: 5m
